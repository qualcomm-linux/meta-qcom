# yaml-language-server: $schema=https://raw.githubusercontent.com/siemens/kas/master/kas/schema-kas.json

header:
  version: 14

local_conf_header:
  ccache: |
    INHERIT += "ccache"
    CCACHE_MAXSIZE = "200G"
    CCACHE_TOP_DIR = "${SSTATE_DIR}/ccache"
    # required to build '-native' target
    HOSTTOOLS += "ccache"
    ASSUME_PROVIDED += "ccache-native"
