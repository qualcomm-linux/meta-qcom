# yaml-language-server: $schema=https://raw.githubusercontent.com/siemens/kas/master/kas/schema-kas.json
#
# Include this kas file to enable test ECDSA PKI keys for Qualcomm
# secure-boot image signing.  These keys are for CI / development use
# only and must NOT be used in production images.
#
# Usage: kas build ci/<machine>.yml:ci/secure-boot.yml:ci/ecdsa-secure-boot-test-keys.yml

header:
  version: 14

local_conf_header:
  ecdsa-secure-boot-test-keys: |
    QCOM_FIRMWARE_SIGN_ROOT_CERT = "${LAYERDIR_qcom}/ci/test-keys/ecdsa/qpsa_rootca0.cer"
    QCOM_FIRMWARE_SIGN_CA_CERT   = "${LAYERDIR_qcom}/ci/test-keys/ecdsa/qpsa_attestca0.cer"
    QCOM_FIRMWARE_SIGN_CA_KEY    = "${LAYERDIR_qcom}/ci/test-keys/ecdsa/qpsa_attestca0.key"
    QCOM_FIRMWARE_SIGN_ROOT_HASH = "${LAYERDIR_qcom}/ci/test-keys/ecdsa/sha384_roots_hash.txt"

    # Fuse identifiers that go with these keys: blown by
    # firmware-qcom-fuse-blower, so set them together with the OEM keys.
    QCOM_FUSE_OEM_HW_ID              = "0x0001"
    QCOM_FUSE_OEM_PRODUCT_ID         = "0xabcd"
    QCOM_FUSE_SEC_KEY_DERIVATION_KEY = ""
