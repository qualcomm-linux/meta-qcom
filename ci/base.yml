# yaml-language-server: $schema=https://raw.githubusercontent.com/siemens/kas/master/kas/schema-kas.json

header:
  version: 14

distro: nodistro

defaults:
  repos:
    branch: wrynose

repos:
  meta-qcom:

  oe-core:
    url: https://github.com/openembedded/openembedded-core
    patches:
      001-initramfs-root-only-udev-trigger:
        repo: meta-qcom
        path: patches/oe-core/0001-initramfs-framework-add-opt-in-root-only-udev-trigger.patch
      002-initramfs-label-root-only-udev-trigger:
        repo: meta-qcom
        path: patches/oe-core/0002-initramfs-framework-support-label-with-root-only-udev-trigger.patch
      003-busybox-findfs:
        repo: meta-qcom
        path: patches/oe-core/0003-busybox-enable-findfs-for-initramfs-label-support.patch
      004-initramfs-rootfs-no-external-commands:
        repo: meta-qcom
        path: patches/oe-core/0004-initramfs-framework-avoid-external-commands-in-rootfs-resolution.patch
      005-initramfs-efivarfs-opt-out:
        repo: meta-qcom
        path: patches/oe-core/0005-initramfs-framework-allow-opting-out-of-efivarfs-mount.patch
      006-initramfs-cmdline-no-processes:
        repo: meta-qcom
        path: patches/oe-core/0006-initramfs-framework-avoid-processes-when-parsing-cmdline.patch
      007-initramfs-module-loop-no-external-commands:
        repo: meta-qcom
        path: patches/oe-core/0007-initramfs-framework-avoid-external-commands-in-module-loop.patch
    layers:
      meta:

  meta-lts-mixins:
    url: https://git.yoctoproject.org/meta-lts-mixins
    branch: wrynose/linux-firmware
    patches:
      001-shikra-wlan-fw:
        repo: meta-qcom
        path: patches/linux-firmware-mixin/0001-linux-firmware-backport-shikra-wlan-firmware-support.patch
      002-shikra-wifi-pkg:
        repo: meta-qcom
        path: patches/linux-firmware-mixin/0002-linux-firmware-package-qcom-shikra-wifi-firmware.patch
      003-shikra-wlan-fw-link:
        repo: meta-qcom
        path: patches/linux-firmware-mixin/0003-linux-firmware-backport-patch-to-symlink-shikra-wifi.patch
      004-revert-qcs615-adsp:
        repo: meta-qcom
        path: patches/linux-firmware-mixin/0004-linux-firmware-revert-qcs615-ADSP-firmware-to-fix-au.patch

  bitbake:
    url: https://github.com/openembedded/bitbake
    branch: "2.18"
    layers:
      .: disabled

local_conf_header:
  base: |
    CONF_VERSION = "2"
    INHERIT += "buildstats-summary"
    INHERIT += "buildhistory"
    INHERIT += "rm_work"
    INHERIT += "image-buildinfo"
  diskmon: |
    BB_DISKMON_DIRS ??= "\
      STOPTASKS,${TMPDIR},1G,100K \
      STOPTASKS,${DL_DIR},1G,100K \
      STOPTASKS,${SSTATE_DIR},1G,100K \
      STOPTASKS,/tmp,100M,100K \
      HALT,${TMPDIR},100M,1K \
      HALT,${DL_DIR},100M,1K \
      HALT,${SSTATE_DIR},100M,1K \
      HALT,/tmp,10M,1K"
  clo-mirrors: |
    MIRRORS:append = " \
    git://github.com git://git.codelinaro.org/clo/yocto-mirrors/github/ \
    git://.*/ git://git.codelinaro.org/clo/yocto-mirrors/ \
    https://.*/.*/ https://artifacts.codelinaro.org/codelinaro-le/ \
    "
  cmdline: |
    KERNEL_CMDLINE_EXTRA:append = " qcom_scm.download_mode=1"
  extra: |
    DISTRO_FEATURES:append = " efi pam pni-names"
    EXTRA_IMAGE_FEATURES += "allow-empty-password empty-root-password allow-root-login"
    IMAGE_ROOTFS_EXTRA_SPACE = "307200"
    WATCHDOG_RUNTIME_SEC:pn-systemd = "30"
  os-release: |
    # Record a build identifier in /etc/os-release. Defaults to a clearly
    # marked local value; CI overrides BUILD_ID with the run id via the
    # generated ci/build-id.yml fragment (see .github/workflows/compile.yml).
    # Use a weak assignment so the CI override wins regardless of how kas
    # orders the merged local.conf fragments.
    OS_RELEASE_FIELDS:append = " BUILD_ID"
    BUILD_ID ?= "local-${DATETIME}"

machine: unset

target:
  - core-image-base
