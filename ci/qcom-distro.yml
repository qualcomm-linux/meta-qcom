# yaml-language-server: $schema=https://raw.githubusercontent.com/siemens/kas/master/kas/schema-kas.json

header:
  version: 14

distro: qcom-distro

defaults:
  repos:
    branch: master

repos:
  meta-qcom-distro:
    url: https://github.com/qualcomm-linux/meta-qcom-distro
    branch: main
    patches:
      qwes-openssl4:
        repo: meta-qcom
        path: patches/meta-qcom-distro/0001-qcom-multimedia-proprietary-image-drop-qwes-until-it.patch

  meta-openembedded:
    url: https://github.com/openembedded/meta-openembedded
    layers:
      meta-filesystems:
      meta-gnome:
      meta-multimedia:
      meta-networking:
      meta-oe:
      meta-python:
      meta-xfce:

  meta-ai:
    url: https://github.com/qualcomm-linux/meta-ai
    branch: main

  meta-virtualization:
    url: https://git.yoctoproject.org/meta-virtualization

  meta-audioreach:
    url: https://github.com/AudioReach/meta-audioreach

  meta-selinux:
    url: https://git.yoctoproject.org/meta-selinux
    patches:
      libsepol-nativesdk:
        repo: meta-qcom
        path: patches/selinux/0001-libsepol-enable-nativesdk.patch
      libselinux-nativesdk:
        repo: meta-qcom
        path: patches/selinux/0002-libselinux-enable-nativesdk.patch
      libselinux-python-swig-4.5:
        repo: meta-qcom
        path: patches/selinux/0003-libselinux-python-fix-the-build-against-swig-4.5.0.patch

  meta-updater:
    url: https://github.com/uptane/meta-updater

  meta-security:
    url: https://git.yoctoproject.org/meta-security
    patches:
      trousers-openssl4:
        repo: meta-qcom
        path: patches/meta-security/0001-trousers-Fix-build-with-OpenSSL-4.x.patch
      tpm2-openssl-openssl4:
        repo: meta-qcom
        path: patches/meta-security/0002-tpm2-openssl-Fix-build-with-OpenSSL-4.x.patch
      tpm2-tools-5.8:
        repo: meta-qcom
        path: patches/meta-security/0003-tpm2-tools-Upgrade-5.7-5.8.patch
      tpm2-pkcs11-1.10.1:
        repo: meta-qcom
        path: patches/meta-security/0004-tpm2-pkcs11-Upgrade-1.9.2-1.10.1.patch
      tpm2-tss-engine-openssl4:
        repo: meta-qcom
        path: patches/meta-security/0005-packagegroup-security-tpm2-Remove-tpm2-tss-engine-fr.patch
    layers:
      .:
      meta-tpm:

local_conf_header:
  virtualization:
    SKIP_META_VIRT_SANITY_CHECK = "1"

target:
  - qcom-multimedia-image
  - qcom-multimedia-proprietary-image
  - qcom-container-orchestration-image
  - qcom-networking-image
