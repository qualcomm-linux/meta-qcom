# Known failures for qcom-distro, see README.md for the format.

monaco-evk:
  # the UFS link fails to recover on runtime resume and the rootfs turns
  # read-only, so the remaining capture tests cannot write their results
  - test: AudioRecord_Config08
    comment: UFS link recovery fails during the audio tests
    kernels:
      - linux-qcom-next
  - test: AudioRecord_Config09
    comment: UFS link recovery fails during the audio tests
    kernels:
      - linux-qcom-next
  - test: AudioRecord_Config10
    comment: UFS link recovery fails during the audio tests
    kernels:
      - linux-qcom-next

shikra-iqs-evk:
  # CPU hotplug fails with the legacy (QTEE) boot flow once KVM is the
  # default hypervisor. QTEE is not PoR for Shikra; OPTEE is, and the fix
  # comes with a new QTEE boot-critical binary.
  - test: hotplug
    comment: https://github.com/qualcomm-linux/meta-qcom/issues/3643

sm8750-mtp:
  # average FPS stays around 81 on a 120 Hz display, below the 102 threshold
  - test: weston-simple-egl
    comment: average FPS below the refresh rate threshold
