[Unit]
After=var-lib-tee.mount

[Service]
ExecStartPre=+/bin/sh -c '[ "$(stat -c %G /var/lib/tee)" = "teesuppl" ] || chgrp teesuppl /var/lib/tee'
ExecStartPre=+/bin/sh -c '[ "$(stat -c %a /var/lib/tee)" = "770" ] || chmod 0770 /var/lib/tee'
