#@TYPE: Machine
#@NAME: Advantech SOM-6820 on SOM-DB5830 (Hamoa COMe)
#@DESCRIPTION: Machine configuration for the Advantech SOM-6820 COM Express module on SOM-DB5830 carrier board

require conf/machine/include/qcom-hamoa.inc

MACHINE_FEATURES += "efi pci tpm2"

# The DT is not available in linux-yocto yet, only in linux-qcom kernels
LINUX_QCOM_KERNEL_DEVICETREE ?= " \
    qcom/hamoa-advantech-som-db5830.dtb \
"

# Flash a single DTB in the dtb partition, no FIT image for this board yet
QCOM_DTB_DEFAULT ?= "hamoa-advantech-som-db5830"

MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS += " \
    packagegroup-hamoa-iot-evk-firmware \
    packagegroup-hamoa-iot-evk-hexagon-dsp-binaries \
    qcom-fastcv-binaries-hamoa-iot-evk-dsp \
"

# Boot binaries and partition layout are shared with the Hamoa EVK
QCOM_CDT_FILE = "HAMOA_COMe_0.1.0"
QCOM_BOOT_FILES_SUBDIR = "iq-x7181"
QCOM_PARTITION_FILES_SUBDIR ?= "partitions/iq-x7181-evk/ufs"
QCOM_PARTITION_FILES_SUBDIR_SPINOR ?= "partitions/iq-x7181-evk/spinor"

QCOM_BOOT_FIRMWARE = "firmware-qcom-boot-iq-x7181"
QCOM_CDT_FIRMWARE = "firmware-qcom-cdt-iq-x7181-som-db5830"

CAPSULE_GUID       = "0F6D58FC-2258-4D27-9E23-D77219B0897C"
CAPSULE_FLASH_TYPE = "NORUFS"
CAPSULE_ENTRIES    = "dtb"

# Hamoa stores the Linux DTB FIT image in SPINOR.  The firmware uses a
# main/backup model: dtb is always the active partition; dtb_BACKUP holds a
# rollback copy that is overwritten by <Backup> before dtb is updated.
CAPSULE_ENTRY_dtb[binary]           = "dtb.bin"
CAPSULE_ENTRY_dtb[dest_disk]        = "SPINOR"
CAPSULE_ENTRY_dtb[dest_partition]   = "dtb"
CAPSULE_ENTRY_dtb[dest_guid]        = "{2A1A52FC-AA0B-401C-A808-5EA0F91068F8}"
CAPSULE_ENTRY_dtb[backup_disk]      = "SPINOR"
CAPSULE_ENTRY_dtb[backup_partition] = "dtb_BACKUP"
CAPSULE_ENTRY_dtb[backup_guid]      = "{A166F11A-2B39-4FAA-B7E7-F8AA080D0587}"
