#@TYPE: Machine
#@NAME: Qualcomm Dragonwing IQ10 RRD (Robotics Reference Design)
#@DESCRIPTION: Machine configuration for Qualcomm IQ10 RRD, built on Nord SoC.

require conf/machine/include/qcom-nord.inc

MACHINE_FEATURES += "phone"

KERNEL_DEVICETREE ?= " \
    qcom/nord-ride-embedded.dtb \
    qcom/nord-rrd.dtb \
    "

# These DTs are not upstreamed and currently exist only in linux-qcom-next
# and linux-qcom-es kernels
NORD_RRD_CAMX_DEVICETREE = " \
                      qcom/nord-ride-embedded-camx.dtbo \
                      qcom/nord-rrd-camx.dtbo \
                      qcom/nord-embedded-el2.dtbo \
                      qcom/nord-camx-el2.dtbo \
                      "
KERNEL_DEVICETREE:append:pn-linux-qcom-next = "${NORD_RRD_CAMX_DEVICETREE}"
KERNEL_DEVICETREE:append:pn-linux-qcom-es = "${NORD_RRD_CAMX_DEVICETREE}"

# With the kvm machine feature Linux runs at EL2, so the plain Nord compatibles
# also apply the EL2 overlay.
LINUX_QCOM_FIT_DTB_COMPATIBLE:append = "${@bb.utils.contains('MACHINE_FEATURES', 'kvm', ' conf/machine/include/fit-dtb-compatible-kvm.inc', '', d)}"

MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS += " \
    packagegroup-nord-rrd-firmware \
    packagegroup-nord-rrd-hexagon-dsp-binaries \
    qcom-fastcv-binaries-sa8797p-ride-embedded-dsp \
"

QCOM_CDT_FILE = "cdt_ridesx"
QCOM_BOOT_FILES_SUBDIR = "nord"
QCOM_PARTITION_FILES_SUBDIR ?= "partitions/nord-rrd/ufs"
QCOM_PARTITION_FILES_SUBDIR_SPINOR ?= "partitions/nord-rrd/spinor"

QCOM_BOOT_FIRMWARE = "firmware-qcom-boot-nord"
QCOM_CDT_FIRMWARE = "firmware-qcom-cdt-nord"
