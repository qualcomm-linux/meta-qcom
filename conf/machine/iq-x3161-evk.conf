#@TYPE: Machine
#@NAME: Qualcomm Purwa Lite IoT Evaluation Kit (EVK) based on IQ-X3161
#@DESCRIPTION: Machine configuration for Qualcomm IQ-X3161 Evaluation Kit (EVK)

# IQ-X3161 is a SKU down from standard Purwa SoC (IQ-X5121). Their CPU and GPU 
# frequency and display capability differences are not expressed in machine 
# metadata, so the settings below match iq-x5121-evk.

require conf/machine/include/qcom-purwa.inc

MACHINE_FEATURES += "efi pci m2connector tpm2 phone"

# IQ-X3161 and IQ-X5121 share the same devicetree
KERNEL_DEVICETREE ?= " \
    qcom/purwa-iot-evk.dtb \
    qcom/x1-el2.dtbo \
    "

# These DTs are not upstreamed and currently exist only in linux-qcom kernels
LINUX_QCOM_KERNEL_DEVICETREE ?= " \
    qcom/purwa-evk-camx.dtbo \
    qcom/purwa-camx-el2.dtbo \
    qcom/purwa-staging.dtbo \
"

MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS += " \
    packagegroup-purwa-iot-evk-firmware \
    packagegroup-purwa-iot-evk-hexagon-dsp-binaries \
    qcom-fastcv-binaries-purwa-iot-evk-dsp \
"

# IQ-X3161, IQ-X5121 and IQ-x7181 share the same partition configuration.
QCOM_CDT_FILE = "IQ_X_EVK_CDT"
QCOM_BOOT_FILES_SUBDIR = "iq-x7181"
QCOM_PARTITION_FILES_SUBDIR ?= "partitions/iq-x7181-evk/ufs"
QCOM_PARTITION_FILES_SUBDIR_SPINOR ?= "partitions/iq-x7181-evk/spinor"

# IQ-X3161, IQ-X5121 and IQ-x7181 share the same boot firmware and CDT firmware.
QCOM_BOOT_FIRMWARE = "firmware-qcom-boot-iq-x7181"
QCOM_CDT_FIRMWARE = "firmware-qcom-cdt-iq-x7181"
