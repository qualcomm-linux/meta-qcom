#@TYPE: Machine
#@NAME: Qualcomm Kalambo Compute Reference Device
#@DESCRIPTION: Machine configuration for Qualcomm Kalambo Compute Reference Device

require conf/machine/include/qcom-kalambo.inc

MACHINE_FEATURES += "tpm2"

KERNEL_DEVICETREE ?= " \
    qcom/kalambo-crd.dtb \
"

MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS += " \
    packagegroup-kalambo-crd-firmware \
"

# Kalambo-CRD and Glymur-CRD share the same partition configuration.
QCOM_CDT_FILE = "cdt_glymur_crd_0.1.0"
QCOM_BOOT_FILES_SUBDIR = "glymur-crd"
QCOM_PARTITION_FILES_SUBDIR ?= "partitions/glymur-crd/nvme"
QCOM_PARTITION_FILES_SUBDIR_SPINOR ?= "partitions/glymur-crd/spinor"

# Kalambo-CRD and Glymur-CRD share the same boot firmware and CDT firmware.
QCOM_BOOT_FIRMWARE = "firmware-qcom-boot-glymur"
QCOM_CDT_FIRMWARE = "firmware-qcom-cdt-glymur"
