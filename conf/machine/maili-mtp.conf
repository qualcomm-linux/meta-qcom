#@TYPE: Machine
#@NAME: Qualcomm Maili MTP
#@DESCRIPTION: Machine configuration for Qualcomm Maili (SM8950) MTP

require conf/machine/include/qcom-sm8950.inc

MACHINE_FEATURES += "efi pci tpm2"

KERNEL_DEVICETREE ?= " \
                      qcom/maili-mtp.dtb \
                      "
QCOM_DTB_DEFAULT ?= "maili-mtp"
QCOM_UKI_DEVICETREE = "${QCOM_DTB_DEFAULT}.dtb"

MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS += " \
    packagegroup-maili-mtp-firmware \
    packagegroup-maili-mtp-hexagon-dsp-binaries \
"

# Bootloader configuration
ABL_SIGNATURE_VERSION ?= "v7"
QCOM_BOOT_FILES_SUBDIR = "maili"
QCOM_BOOT_FIRMWARE = "firmware-qcom-boot-maili"

QCOM_PARTITION_FILES_SUBDIR ?= "partitions/maili-mtp/ufs"
