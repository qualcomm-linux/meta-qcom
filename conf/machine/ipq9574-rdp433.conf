#@TYPE: Machine
#@NAME: Qualcomm IPQ9574 RDP433
#@DESCRIPTION: Machine configuration for Qualcomm IPQ9574 RDP433

require conf/machine/include/qcom-ipq9574.inc


QCOM_DTB_DEFAULT ?= "ipq9574-rdp433"

KERNEL_DEVICETREE ?= "qcom/ipq9574-rdp433.dtb"

# The FIT-image recipe inherits uboot-config and requires UBOOT_MACHINE to be
# non-empty, although this target only assembles the kernel FIT. RDP433 uses
# an out-of-tree U-Boot, so scope this marker to the FIT recipe rather than
# advertising a defconfig for an in-tree U-Boot build.
UBOOT_MACHINE:pn-linux-yocto-fitimage = "ipq9574-rdp433-external-uboot"
