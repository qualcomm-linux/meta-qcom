#@TYPE: Machine
#@NAME: Qualcomm Eliza Evaluation Kit (EVK)
#@DESCRIPTION: Machine configuration for Qualcomm Eliza Evaluation Kit (EVK)

require conf/machine/include/qcom-eliza.inc

MACHINE_FEATURES += "efi m2connector pci"

KERNEL_DEVICETREE ?= " \
    qcom/eliza-cqs-evk-emmc.dtb \
"

MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS += " \
    packagegroup-eliza-evk-firmware \
    packagegroup-eliza-evk-hexagon-dsp-binaries \
"

QCOM_CDT_FILE = "cdt_eliza_evk_0.7.0"
QCOM_BOOT_FILES_SUBDIR = "eliza"
QCOM_PARTITION_FILES_SUBDIR ?= "partitions/eliza-evk/emmc"

QCOM_BOOT_FIRMWARE = "firmware-qcom-boot-eliza"
QCOM_CDT_FIRMWARE = "firmware-qcom-cdt-eliza"
