#@TYPE: Machine
#@NAME: Qualcomm RB5Gen2 Development Kit (Core Kit)
#@DESCRIPTION: Machine configuration for Qualcomm RB5Gen2 development kit, with QCS8550

require conf/machine/include/qcom-qcs8550.inc

MACHINE_FEATURES += "efi pci"

QCOM_DTB_DEFAULT ?= "qcs8550-rb5gen2"

KERNEL_DEVICETREE ?= " \
    qcom/qcs8550-rb5gen2.dtb \
"
QCOM_UKI_DEVICETREE = "qcs8550-rb5gen2.dtb"

MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS += " \
    packagegroup-sm8550-hdk-firmware \
    packagegroup-sm8550-hdk-hexagon-dsp-binaries \
    qps615-dlkm \
"

QCOM_CDT_FILE = "rb5g2_dvt_8550_CDT"
QCOM_BOOT_FILES_SUBDIR = "qcs8550"
QCOM_PARTITION_FILES_SUBDIR ?= "partitions/qcs8550-rb5gen2/ufs"

QCOM_BOOT_FIRMWARE = "firmware-qcom-boot-qcs8550"
QCOM_CDT_FIRMWARE = "firmware-qcom-cdt-qcs8550"
