#
# Firmware filename -> sectools image id, for qcom-firmware-sign.bbclass.
# Names are shell globs and the first match wins, so keep specific entries
# ahead of general ones.  Unlisted files are left unsigned with a warning;
# SKIP marks a file as not signable.
#
# There is no upstream source for this mapping; it was put together from
# the Qualcomm boot binaries and HLOS firmware currently shipped here.  The
# ids a Security Profile knows are listed by
#     sectools secure-image --available-image-ids --security-profile <xml>
# and the Software ID a pre-signed image already carries by
#     sectools secure-image --inspect <file>
# which the profile maps back to an id (<sw_id> in the <image> entries).
# Extend the map for a machine or SoC with
#     QCOM_FIRMWARE_SIGN_IMAGE_ID_MAP:append:<override> = " name.mbn:ID"

QCOM_FIRMWARE_SIGN_IMAGE_ID_MAP ??= "\
    adsp.mbn:ADSP \
    adsp_dtb.mbn:Q6-ADSP-DTB \
    aop.mbn:AOP \
    CAMERA_ICP.mbn:CAMERA-FW \
    CAMERA_ICP_170.elf:CAMERA-FW \
    cdsp.mbn:CDSP \
    cdsp_dtb.mbn:Q6-CDSP0-DTB \
    cpucp.elf:CPUCP \
    devcfg.mbn:TZ-DEVCFG \
    DigestsToSign.bin.mbn:VIP \
    hypvm.mbn:QHEE \
    imagefv.elf:UEFIFV \
    ipa_fws.mbn:IPA-FW \
    loadalgota64.mbn:TZ-APP-OEM \
    msbtfw11.mbn:SKIP \
    multi_image.mbn:OEM-MISC \
    prog_firehose_ddr.elf:DEVICE-PROGRAMMER \
    prog_firehose_lite.elf:DEVICE-PROGRAMMER \
    prog_snagboot_ddr.elf:DEVICE-PROGRAMMER \
    qupv3fw.elf:QUPV3 \
    sec.elf:SEC-ELF \
    shrm.elf:SHRM \
    tz.mbn:TZ \
    uefi.elf:UEFI \
    uefi_sec.mbn:TZ-APP-OEM \
    vpu*.mbn:VENUS-FW \
    wpss.mbn:WPSS \
    xbl.elf:XBL \
    xbl_config*.elf:XBL-CONFIG \
    XblRamdump.elf:XBL-RAM-DUMP \
    *_zap.mbn:GPU-MICRO-CODE \
    *-*-*-*-*.mbn:TZ-APP-OEM \
"
