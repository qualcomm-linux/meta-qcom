# Verify the signatures of the images the SPL loads from the FIT.
#
# uboot-sign.bbclass embeds the public key into the SPL device tree whenever it
# signs the FIT, but the SPL only acts on it when built with this option: the
# key is otherwise present and unused. Each verified image is then reported on
# the console as "## Checking hash(es) for Image <name> ... OK".
CONFIG_SPL_FIT_SIGNATURE=y

# SPL_FIT_SIGNATURE only implies SPL_RSA, and SPL_RSA is hidden behind "if RSA"
# in lib/rsa/Kconfig, so without RSA the implication cannot take effect and the
# SPL ends up with the verification framework but no algorithm to verify
# rsa2048 signatures with. Enable both explicitly.
CONFIG_RSA=y
CONFIG_SPL_RSA=y
