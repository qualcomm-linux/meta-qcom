name: Weekly Build Dispatcher (wrynose)

on:
  schedule:
  # NOTE - changes to the cron spec should be pushed by https://github.com/quic-yocto-ci
  # so that build notification emails will be sent out properly.
  # At 2:22 UTC on Wednesday and Saturday - the slots the nightly dispatcher
  # gives up, so that the weekly build takes over the nightly run on wrynose
  # those two days just like the weekly build does on this branch.
  - cron: "22 2 * * 3,6"

permissions:
  contents: read

jobs:
  trigger-build:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Trigger Weekly Build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run --repo "${GH_REPO}" --ref wrynose weekly-build.yml
