name: Nightly Build Dispatcher (wrynose)

on:
  schedule:
  # NOTE - changes to the cron spec should be pushed by https://github.com/quic-yocto-ci
  # so that build notification emails will be sent out properly.
  # At 2:22 UTC on Sunday, Monday, Tuesday, Thursday and Friday - picked a
  # random "minute" as top of hour can be busy in github. Kept 2 hours after
  # the master nightly/weekly build (0:23 UTC) so the two branches do not
  # build at the same time. Wednesday and Saturday are covered by the weekly
  # build dispatcher, which triggers a superset of this matrix on wrynose.
  - cron: "22 2 * * 0,1,2,4,5"

permissions:
  checks: write
  pull-requests: write
  contents: read
  packages: read
  actions: write

jobs:
  trigger-build:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Nightly Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run --repo ${{ github.repository }} --ref wrynose nightly-build.yml
