name: Weekly Build
run-name: "Weekly Build (${{ github.ref_name }})"

on:
  workflow_dispatch:
  schedule:
  # NOTE - changes to the cron spec should be pushed by https://github.com/quic-yocto-ci
  # so that build notification emails will be sent out properly.
  # At 0:23 UTC on Wednesday and Saturday - picked a random "minute" as top of
  # hour can be busy in github. The weekly build repeats the whole nightly
  # matrix and adds the entries that are too expensive to build every night,
  # so it takes over the nightly slot on those two days.
  - cron: "23 0 * * 3,6"

permissions:
  contents: read

jobs:
  build-weekly:
    permissions:
      contents: read
      packages: read
      actions: read
    uses: $/.github/workflows/build-yocto.yml
    with:
      profile: weekly
      skip_if_github_cached: true
  test-weekly:
    if: needs.build-weekly.outputs.build_skipped != 'true'
    permissions:
      contents: read
      actions: read
      checks: write
      pull-requests: write
    uses: $/.github/workflows/test.yml
    needs: build-weekly
    secrets:
      LAVATOKEN: ${{ secrets.LAVATOKEN }}
    with:
      build_id: ${{ github.run_id }}
  publish-test-results:
    if: needs.build-weekly.outputs.build_skipped != 'true'
    permissions:
      contents: read
      packages: read
      actions: read
      checks: write
      pull-requests: write
    uses: $/.github/workflows/publish-results.yml
    needs: [build-weekly, test-weekly]
    secrets:
      TEST_REPORTING_APP_TOKEN: ${{ secrets.TEST_REPORTING_APP_TOKEN }}
    with:
      workflow_id: ${{ github.run_id }}
      event_name: ${{ github.event_name }}
      event_file: ${{ github.event_path }}
      commit: ${{ github.sha }}
