name: Build Yocto

on:
  workflow_call:
    inputs:
      profile:
        required: false
        type: string
        default: "full" # values: pr | full | weekly
      skip_if_github_cached:
        required: false
        type: boolean
        default: false
        description: "Skip the build matrix if the github actions cache already records a previously-successful run for the same inputs"
    outputs:
      artifacts_url:
        description: "URL to retrieve build artifacts"
        value: ${{ jobs.create-output.outputs.url }}
      build_skipped:
        description: "True when the compile matrix was skipped because the github cache recorded a previously-successful build for the same inputs"
        value: ${{ jobs.github-cache-check.outputs.cache_hit }}

# Concurrency is used to prevent multiple workflows from running for the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('push-{0}', github.sha) }}
  cancel-in-progress: true

env:
  CACHE_DIR: /efs/qli/meta-qcom
  KAS_CLONE_DEPTH: 1
  KAS_CONTAINER: ${{ github.workspace }}/kas-container
  KAS_CONTAINER_IMAGE: ghcr.io/siemens/kas/kas:5.5

jobs:
  kas-setup:
    if: github.repository_owner == 'qualcomm-linux'
    runs-on: [self-hosted, qcom-u2404, amd64]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setting up kas-container
        run: |
          docker create --name kas ${KAS_CONTAINER_IMAGE}
          docker cp kas:/usr/local/bin/kas-container $KAS_CONTAINER
          LATEST=$(git ls-remote --tags --refs --sort="v:refname" https://github.com/siemens/kas | tail -n1 | sed 's/.*\///')
          if ! grep -q "KAS_CONTAINER_SCRIPT_VERSION=\"${LATEST}\"" $KAS_CONTAINER ; then
            echo "Version "${LATEST}" of kas is available, please update "KAS_CONTAINER_IMAGE: $KAS_CONTAINER_IMAGE""
          fi

      - name: Run kas lock
        run: |
          ${KAS_CONTAINER} lock ci/base.yml:ci/qcom-distro.yml:ci/meta-arm.yml

      - name: Upload kas
        uses: actions/upload-artifact@v6
        with:
          name: kas
          if-no-files-found: error
          path: |
            ci/*.lock.yml
            kas-container

  github-cache-check:
    needs: kas-setup
    if: github.repository_owner == 'qualcomm-linux'
    runs-on: ubuntu-latest
    outputs:
      cache_hit: ${{ steps.restore.outputs.cache-hit == 'true' }}
      run_hash: ${{ steps.hash.outputs.run_hash }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download kas
        uses: actions/download-artifact@v7
        with:
          name: kas

      - name: Compute build input hash
        id: hash
        run: |
          # Hash inputs that fully determine the build:
          # - the resolved base.lock.yml produced by `kas lock` (pins every layer)
          # - the meta-qcom revision being built
          LOCK_HASH=$(sha256sum ci/base.lock.yml | cut -d' ' -f1)
          SRC_HASH=$(git rev-parse HEAD)
          RUN_HASH=$(printf '%s\n%s' "$LOCK_HASH" "$SRC_HASH" | sha256sum | cut -d' ' -f1)
          echo "base.lock.yml hash: $LOCK_HASH"
          echo "meta-qcom HEAD: $SRC_HASH"
          echo "Combined run hash: $RUN_HASH"
          echo "run_hash=$RUN_HASH" >> "$GITHUB_OUTPUT"

      - name: Look up previous successful build marker in github cache
        id: restore
        uses: actions/cache/restore@v5
        with:
          path: /tmp/build-success-marker
          key: build-success-${{ github.repository }}-${{ github.workflow }}-${{ github.ref_name }}-${{ steps.hash.outputs.run_hash }}
          lookup-only: true

      - name: Report github-cache-check decision
        env:
          SKIP_IF_CACHED: ${{ inputs.skip_if_github_cached }}
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
          RUN_HASH: ${{ steps.hash.outputs.run_hash }}
        run: |
          if [ "${SKIP_IF_CACHED}" != "true" ]; then
            echo "skip_if_github_cached not set; build will run"
          elif [ "${CACHE_HIT}" = "true" ]; then
            echo "Run cache hit on key build-success, hash ${RUN_HASH}: skipping build matrix"
          else
            echo "No previous successful build run recorded in github cache for this hash: build will run"
          fi

  yocto-run-checks:
    needs: [kas-setup, github-cache-check]
    if: |
      github.repository_owner == 'qualcomm-linux' &&
      (inputs.skip_if_github_cached != true || needs.github-cache-check.outputs.cache_hit != 'true')
    runs-on: [self-hosted, qcom-u2404, amd64]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download kas
        uses: actions/download-artifact@v7
        with:
          name: kas

      - name: Setting up kas-container
        run: |
          chmod +x $KAS_CONTAINER

      - name: Setup cache variables (used by oe-selftest)
        run: |
          echo "DL_DIR=${CACHE_DIR}/downloads" >> $GITHUB_ENV
          # use a single shared sstate cache folder, cleaned up by mtime
          echo "SSTATE_DIR=${CACHE_DIR}/sstate-cache" >> $GITHUB_ENV

      - name: Run Yocto patchreview
        run: |
          ci/kas-container-shell-helper.sh ci/yocto-patchreview.sh

      - name: Run yocto-check-layer
        run: |
          ci/kas-container-shell-helper.sh ci/yocto-check-layer.sh

      - name: Run oe-selftest
        run: |
          ci/kas-container-shell-helper.sh ci/oe-selftest.sh

  compile-env:
    if: github.repository_owner == 'qualcomm-linux'
    runs-on: ubuntu-latest
    outputs:
      CACHE_DIR: ${{ steps.compile_env.outputs.CACHE_DIR }}
    steps:
      - name: Setup compile variables
        id: compile_env
        run: |
          echo "CACHE_DIR=${{env.CACHE_DIR}}" >> $GITHUB_OUTPUT

  testimage:
    needs: [kas-setup, github-cache-check, compile-env]
    if: |
      github.repository_owner == 'qualcomm-linux' &&
      (inputs.skip_if_github_cached != true || needs.github-cache-check.outputs.cache_hit != 'true')
    strategy:
      fail-fast: false
      matrix:
        machine:
          - testimage
        distro:
          - name: nodistro
            yamlfile: ""
    uses: ./.github/workflows/compile.yml
    with:
      run_on: arm64
      name: ${{ matrix.machine }}/${{ matrix.distro.name }}
      world: false
      machine: ${{matrix.machine}}
      distro_yaml: ${{matrix.distro.yamlfile}}
      distro_name: ${{matrix.distro.name}}
      kernel_yaml: ''
      kernel_dirname: ''
      cache_dir: ${{ needs.compile-env.outputs.CACHE_DIR }}

  testimage-runs:
    needs: [testimage, github-cache-check, compile-env]
    if: |
      github.repository_owner == 'qualcomm-linux' &&
      (inputs.skip_if_github_cached != true || needs.github-cache-check.outputs.cache_hit != 'true')
    strategy:
      fail-fast: false
      matrix:
        machine:
          - testimage-run
        distro:
          - name: nodistro
            yamlfile: ""
    uses: ./.github/workflows/compile.yml
    with:
      run_on: arm64-metal
      name: ${{ matrix.machine }}/${{ matrix.distro.name }}
      world: false
      machine: ${{matrix.machine}}
      distro_yaml: ${{matrix.distro.yamlfile}}
      distro_name: ${{matrix.distro.name}}
      kernel_yaml: ''
      kernel_dirname: ''
      cache_dir: ${{ needs.compile-env.outputs.CACHE_DIR }}

  compile_warm_up:
    needs: [kas-setup, github-cache-check, compile-env]
    if: |
      github.repository_owner == 'qualcomm-linux' &&
      (inputs.skip_if_github_cached != true || needs.github-cache-check.outputs.cache_hit != 'true')
    strategy:
      fail-fast: true
      matrix:
        machine:
          - glymur-crd
          - qcom-armv8a
          - rb3gen2-core-kit
        distro:
          - name: nodistro
            yamlfile: ""
          - name: qcom-distro
            yamlfile: ':ci/qcom-distro.yml'
        kernel:
          - type: default
            dirname: ""
            yamlfile: ""
    uses: ./.github/workflows/compile.yml
    with:
      name: ${{ matrix.machine }}/${{ matrix.distro.name }}${{ matrix.kernel.dirname }}
      # One world build per machine and distro family is enough for compile
      # coverage: nodistro (including the nogl variant) covers the plain OE
      # configuration and qcom-distro-catchall enables a superset of the
      # qcom-distro DISTRO_FEATURES, so the remaining distro and kernel
      # combinations only repeat already-covered world builds. qcom-armv7a has
      # no qcom-distro-catchall variant, so its qcom-distro build is the
      # distro-family world build for that machine.
      world: ${{ (startsWith(matrix.distro.name, 'nodistro') || matrix.distro.name == 'qcom-distro-catchall' || (matrix.machine == 'qcom-armv7a' && matrix.distro.name == 'qcom-distro')) && matrix.kernel.type == 'default' }}
      machine: ${{matrix.machine}}
      distro_yaml: ${{matrix.distro.yamlfile}}
      distro_name: ${{matrix.distro.name}}
      kernel_yaml: ${{matrix.kernel.yamlfile}}
      kernel_dirname: ${{matrix.kernel.dirname}}
      cache_dir: ${{ needs.compile-env.outputs.CACHE_DIR }}
      profile: ${{ inputs.profile }}

  compile_sdk:
    needs: [github-cache-check, compile_warm_up, compile-env]
    if: |
      github.repository_owner == 'qualcomm-linux' &&
      (inputs.skip_if_github_cached != true || needs.github-cache-check.outputs.cache_hit != 'true')
    uses: ./.github/workflows/compile.yml
    with:
      name: qcom-armv8a/qcom-distro-sdk
      sdk: true
      target: false
      world: false
      machine: 'qcom-armv8a'
      distro_yaml: ':ci/qcom-distro.yml'
      distro_name: 'qcom-distro-sdk'
      kernel_yaml: ''
      kernel_dirname: ''
      cache_dir: ${{ needs.compile-env.outputs.CACHE_DIR }}
      profile: ${{ inputs.profile }}

  compile:
    needs: [github-cache-check, compile_warm_up, compile-env]
    if: |
      github.repository_owner == 'qualcomm-linux' &&
      (inputs.skip_if_github_cached != true || needs.github-cache-check.outputs.cache_hit != 'true')
    strategy:
      fail-fast: false
      matrix:
        machine:
          - glymur-crd
          - iq-615-evk
          - iq-8275-evk
          - iq-9075-evk
          - iq-x5121-evk
          - iq-x7181-evk
          - kaanapali-mtp
          - qcm6490-idp
          - qcom-armv8a
          - qcs615-ride
          - qcs8300-ride-sx
          - qcs9100-ride-sx
          - rb1-core-kit
          - rb3gen2-core-kit
          - shikra-evk
          - sm8750-mtp
        distro:
          - name: nodistro
            yamlfile: ""
          - name: qcom-distro
            yamlfile: ':ci/qcom-distro.yml'
          - name: qcom-distro-catchall
            yamlfile: ':ci/qcom-distro-catchall.yml'
          - name: debug
            yamlfile: ':ci/qcom-distro-catchall.yml:ci/debug.yml'
            profile: full
          - name: performance
            yamlfile: ':ci/qcom-distro-catchall.yml:ci/performance.yml'
            profile: full
        kernel:
          - type: default
            dirname: ""
            yamlfile: ""
          - type: 6.18
            dirname: "_linux-qcom-6.18"
            yamlfile: ":ci/linux-qcom-6.18.yml"
          - type: rt-6.18-distro-kvm
            dirname: "_linux-qcom-rt-6.18_qcom-distro-kvm"
            yamlfile: ":ci/linux-qcom-rt-6.18.yml:ci/qcom-distro-kvm.yml"
        exclude:
          # 6.18 RT selects qcom-distro by default, remove others
          - distro:
                name: nodistro
            kernel:
                type: rt-6.18-distro-kvm
          - distro:
                name: qcom-distro-catchall
            kernel:
                type: rt-6.18-distro-kvm
          # Exclude jobs from compile_warm_up
          - machine: glymur-crd
            distro:
                name: nodistro
            kernel:
                type: default
          - machine: glymur-crd
            distro:
                name: qcom-distro
            kernel:
                type: default
          - machine: qcom-armv8a
            distro:
                name: nodistro
            kernel:
                type: default
          - machine: qcom-armv8a
            distro:
                name: qcom-distro
            kernel:
                type: default
          - machine: rb3gen2-core-kit
            distro:
                name: nodistro
            kernel:
                type: default
          - machine: rb3gen2-core-kit
            distro:
                name: qcom-distro
            kernel:
                type: default
        include:
          # Additional builds for specific machines
          - machine: qcom-armv8a
            distro:
                name: nodistro-nogl
                yamlfile: ':ci/test-oe-nogl.yml'
            kernel:
                type: default
                dirname: ""
                yamlfile: ""
          - machine: qcom-armv8a
            distro:
                name: qcom-distro
                yamlfile: ':ci/qcom-distro.yml'
            kernel:
                type: additional
                dirname: "_linux-yocto-dev"
                yamlfile: ":ci/linux-yocto-dev.yml"
          - machine: iq-9075-evk
            distro:
                name: qcom-distro
                yamlfile: ':ci/qcom-distro.yml'
            kernel:
                type: qcom-next-rt
                dirname: "_linux-qcom-next-rt"
                yamlfile: ":ci/linux-qcom-next-rt.yml"
          - machine: iq-9075-evk
            distro:
                name: qcom-distro-dpdk
                yamlfile: ':ci/qcom-distro.yml:ci/dpdk.yml'
            kernel:
                type: default
                dirname: ""
                yamlfile: ""
          - machine: rb3gen2-core-kit
            distro:
                name: qcom-distro-kvm
                yamlfile: ':ci/qcom-distro-kvm.yml'
            kernel:
                type: default
                dirname: ""
                yamlfile: ""
          - machine: qcom-armv7a
            distro:
                name: nodistro
                yamlfile: ''
            kernel:
                type: default
                dirname: ""
                yamlfile: ""
          - machine: qcom-armv7a
            distro:
                name: qcom-distro
                yamlfile: ':ci/qcom-distro-multimedia-image.yml'
            kernel:
                type: default
                dirname: ""
                yamlfile: ""
          - machine: qcs615-ride
            distro:
                name: qcom-distro
                yamlfile: ':ci/qcom-distro.yml'
            kernel:
                type: u-boot-qcom-6.18
                dirname: "_linux-qcom-6.18_u-boot-qcom"
                yamlfile: ":ci/linux-qcom-6.18.yml:ci/u-boot-qcom.yml"
          - machine: rb3gen2-core-kit
            distro:
                name: qcom-distro
                yamlfile: ':ci/qcom-distro.yml'
            kernel:
                type: u-boot-qcom-6.18
                dirname: "_linux-qcom-6.18_u-boot-qcom"
                yamlfile: ":ci/linux-qcom-6.18.yml:ci/u-boot-qcom.yml"
          - machine: iq-9075-evk
            distro:
                name: qcom-distro
                yamlfile: ':ci/qcom-distro.yml'
            kernel:
                type: u-boot-qcom-6.18
                dirname: "_linux-qcom-6.18_u-boot-qcom"
                yamlfile: ":ci/linux-qcom-6.18.yml:ci/u-boot-qcom.yml"
          - machine: iq-615-evk
            distro:
                name: qcom-distro
                yamlfile: ':ci/qcom-distro.yml'
            kernel:
                type: u-boot-qcom-6.18
                dirname: "_linux-qcom-6.18_u-boot-qcom"
                yamlfile: ":ci/linux-qcom-6.18.yml:ci/u-boot-qcom.yml"
          - machine: shikra-evk
            distro:
                name: qcom-distro
                yamlfile: ':ci/qcom-distro.yml'
            kernel:
                type: u-boot-qcom-6.18
                dirname: "_linux-qcom-6.18_u-boot-qcom"
                yamlfile: ":ci/linux-qcom-6.18.yml:ci/u-boot-qcom.yml"
          - machine: iq-8275-evk
            distro:
                name: qcom-distro
                yamlfile: ':ci/qcom-distro.yml'
            kernel:
                type: u-boot-qcom-6.18
                dirname: "_linux-qcom-6.18_u-boot-qcom"
                yamlfile: ":ci/linux-qcom-6.18.yml:ci/u-boot-qcom.yml"
          - machine: rb3gen2-core-kit-open-fw
            distro:
                name: qcom-distro-kvm
                yamlfile: ':ci/qcom-distro-kvm.yml'
            kernel:
                type: default
                dirname: ""
                yamlfile: ""
          - machine: iq-9075-evk-open-fw
            distro:
                name: qcom-distro-kvm
                yamlfile: ':ci/qcom-distro-kvm.yml'
            kernel:
                type: default
                dirname: ""
                yamlfile: ""
          - machine: rb3gen2-core-kit
            distro:
                name: nodistro
                yamlfile: ':ci/meta-arm.yml:ci/capsule.yml:ci/capsule-test-keys.yml'
            kernel:
                type: capsule
                dirname: "_capsule"
                yamlfile: ""
          - machine: rb3gen2-core-kit
            distro:
                name: qcom-distro
                yamlfile: ':ci/qcom-distro.yml'
            kernel:
                type: u-boot-qcom-fit-6.18
                dirname: "_linux-qcom-6.18_u-boot-qcom-fit"
                yamlfile: ":ci/linux-qcom-6.18.yml:ci/u-boot-qcom.yml:ci/kernel-fit-image.yml"
          - machine: qcs9100-ride-sx
            distro:
                name: qcom-distro
                yamlfile: ':ci/qcom-distro.yml'
            kernel:
                type: u-boot-qcom-fit-6.18
                dirname: "_linux-qcom-6.18_u-boot-qcom-fit"
                yamlfile: ":ci/linux-qcom-6.18.yml:ci/u-boot-qcom.yml:ci/kernel-fit-image.yml"
          - machine: sdx75-idp
            distro:
                name: nodistro
                yamlfile: ""
            kernel:
                type: default
                dirname: ""
                yamlfile: ""
    uses: ./.github/workflows/compile.yml
    with:
      name: ${{ matrix.machine }}/${{ matrix.distro.name }}${{ matrix.kernel.dirname }}
      # Which profiles build this entry. Entries without distro.profile are
      # built by every profile; an entry marked with distro.profile is built by
      # that profile and by the wider ones above it, ordered pr < full (push
      # and nightly) < weekly. Add "profile: weekly" to the distro entry of a
      # target that is too expensive to build every night.
      enabled: ${{ (matrix.distro.profile || 'any') == 'any' || (matrix.distro.profile == 'full' && inputs.profile != 'pr') || (matrix.distro.profile == 'weekly' && inputs.profile == 'weekly') }}
      # One world build per machine and distro family is enough for compile
      # coverage: nodistro (including the nogl variant) covers the plain OE
      # configuration and qcom-distro-catchall enables a superset of the
      # qcom-distro DISTRO_FEATURES, so the remaining distro and kernel
      # combinations only repeat already-covered world builds. qcom-armv7a has
      # no qcom-distro-catchall variant, so its qcom-distro build is the
      # distro-family world build for that machine.
      world: ${{ (startsWith(matrix.distro.name, 'nodistro') || matrix.distro.name == 'qcom-distro-catchall' || (matrix.machine == 'qcom-armv7a' && matrix.distro.name == 'qcom-distro')) && matrix.kernel.type == 'default' }}
      machine: ${{matrix.machine}}
      distro_yaml: ${{matrix.distro.yamlfile}}
      distro_name: ${{matrix.distro.name}}
      kernel_yaml: ${{matrix.kernel.yamlfile}}
      kernel_dirname: ${{matrix.kernel.dirname}}
      cache_dir: ${{ needs.compile-env.outputs.CACHE_DIR }}
      profile: ${{ inputs.profile }}

  publish_summary:
    needs: [github-cache-check, compile, compile_sdk]
    if: |
      always() && github.repository_owner == 'qualcomm-linux' &&
      (inputs.skip_if_github_cached != true || needs.github-cache-check.outputs.cache_hit != 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/print-build-output
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: build-url*

  github-cache-save:
    needs: [github-cache-check, compile, compile_sdk]
    if: |
      github.repository_owner == 'qualcomm-linux' &&
      inputs.skip_if_github_cached == true &&
      needs.github-cache-check.outputs.cache_hit != 'true' &&
      needs.compile.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Create build success marker
        run: date -u +%FT%TZ > /tmp/build-success-marker

      - name: Save successful build marker to github cache
        uses: actions/cache/save@v5
        with:
          path: /tmp/build-success-marker
          key: build-success-${{ github.repository }}-${{ github.workflow }}-${{ github.ref_name }}-${{ needs.github-cache-check.outputs.run_hash }}

  build_successful:
    if: github.repository_owner == 'qualcomm-linux'
    needs: [compile, compile_sdk]
    runs-on: ubuntu-latest
    steps:
      - name: Build completed successfully
        run: |
          echo "All compile matrix jobs succeeded and artifacts uploaded to S3 bucket"
