name: LAVA test job summary
description: "Build a summary of LAVA test job results and upload it as a workflow artifact"
inputs:
  build_id:
    description: "ID of the workflow run from which the test job artifacts are downloaded"
    required: true
  gh_token:
    description: "GitHub token. It's required to download artifacts from the workflow"
    required: true
  prefix:
    description: "Name pattern of the test job artifacts and of the job JSON files they contain"
    default: "*test-job*"
  summary_file_name:
    description: "File name that is used to save test job summary"
    default: step-summary.txt
  summary_title:
    description: "Title for the summary part of the report"
    required: false
  lava_base_url:
    description: "Base URL of the LAVA instance the results are read from"
    required: false
    default: https://lava.infra.foundries.io
  known_failures_file:
    description: >
      Path to a YAML file listing the failures that are known and accepted for
      the build under test, relative to the workspace. A listed failure is
      reported as a known failure and counted as a pass, and a listed test that
      passes is reported as an unexpected pass and counted as a failure, so a
      stale entry gets noticed. Empty, or a file that does not exist, means no
      known failure. See the README of the directory it lives in for the
      format.
    required: false
    default: ""
  kernel:
    description: >
      Kernel flavour under test. An entry of the known failures list that names
      a "kernels" filter only applies to the flavours it lists.
    required: false
    default: ""
outputs:
  artifact_id:
    description: "ID of the uploaded artifact"
    value: ${{ steps.upload-summary.outputs.artifact-id }}
runs:
  using: "composite"

  steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v7
        with:
          github-token: ${{ inputs.gh_token }}
          run-id: ${{ inputs.build_id }}
          path: artifacts
          pattern: ${{ inputs.prefix }}

      - name: "List files"
        shell: bash
        run: |
          echo $GITHUB_WORKSPACE
          ls -R $GITHUB_WORKSPACE

      - name: Publish Test Job Details
        shell: bash
        env:
          INPUTS_PREFIX: ${{ inputs.prefix }}
          INPUTS_SUMMARY_FILE_NAME: ${{ inputs.summary_file_name }}
          INPUTS_SUMMARY_TITLE: ${{ inputs.summary_title }}
          INPUTS_LAVA_BASE_URL: ${{ inputs.lava_base_url }}
          INPUTS_KNOWN_FAILURES_FILE: ${{ inputs.known_failures_file }}
          INPUTS_KERNEL: ${{ inputs.kernel }}
        run: |
          set -x
          # fail the step with failed command
          set -eo pipefail
          # Inherit errexit to force step failure
          shopt -s inherit_errexit
          # Helper for fetching the URL with retries
          lava_api() {
              local url="${INPUTS_LAVA_BASE_URL}/api/v0.2/$1"
              local wait=30
              local rc=0
              curl -sSf --retry 3 "${url}" || rc=$?
              if [ "${rc}" -ne 0 ]; then
                  echo "::warning title=LAVA request failed::curl exited with ${rc} for ${url}, retrying in ${wait}s" >&2
                  sleep "${wait}"
                  rc=0
                  curl -sSf --retry 3 "${url}" || rc=$?
              fi
              if [ "${rc}" -ne 0 ]; then
                  echo "::error title=LAVA request failed::curl exited with ${rc} for ${url}" >&2
                  return "${rc}"
              fi
          }
          # When a failed LAVA job is re-run, GitHub keeps the original failed
          # job's "<distro>-test-job-<id>" artifact AND adds a new artifact for the
          # re-submitted job (LAVA assigns a fresh, higher id). Both get downloaded
          # here, so without de-duplication the stale failed job is counted again
          # and the summary reports phantom failures even after a green re-run.
          # Keep only the newest LAVA job (highest id) per device + test, keyed by
          # (requested_device_type, description) which is stable across re-runs of
          # the same job. The fields are read from the saved job-detail JSON.
          declare -A KEEP_FILE
          declare -A KEEP_ID
          for TESTJOB in $(find "${GITHUB_WORKSPACE}" -name "${INPUTS_PREFIX}.json")
          do
              KEY=$(jq -r '"\(.requested_device_type)@@\(.description)"' "${TESTJOB}")
              JOB_ID=$(jq -r '.id' "${TESTJOB}")
              if [ -z "${KEEP_ID[$KEY]:-}" ] || [ "${JOB_ID}" -gt "${KEEP_ID[$KEY]}" ]; then
                  KEEP_ID["$KEY"]="${JOB_ID}"
                  KEEP_FILE["$KEY"]="${TESTJOB}"
              fi
          done
          TESTJOBS=$(printf '%s\n' "${KEEP_FILE[@]}")

          INPUT=$(for TESTJOB in ${TESTJOBS}
          do
              JOB_ID=$(cat "$TESTJOB" | jq ".id")
              JOB_URL="${INPUTS_LAVA_BASE_URL}/results/$JOB_ID"
              JOB_DETAILS=$(lava_api "jobs/$JOB_ID/")
              JOB_HEALTH=$(echo "$JOB_DETAILS" | jq -r ".health")
              JOB_STATE=$(echo "$JOB_DETAILS" | jq -r ".state")
              JOB_DEVICE_TYPE=$(echo "$JOB_DETAILS" | jq -r ".requested_device_type")
              JOB_TITLE=$(echo "$JOB_DETAILS" | jq -r ".description")
              JOB_TYPE="test"
              if echo "${JOB_TITLE}" | grep -q "boot"; then
                  JOB_TYPE="boot"
              fi
              if [ "${JOB_TYPE}" = "boot" ]; then
                  # boot result comes from the job itself, so it is reported
                  # even when the job has no test suites
                  if [ "${JOB_STATE}" = "Finished" ] && [ ${JOB_HEALTH} = "Complete" ]; then
                      TEST_RESULT_BOOT="pass"
                  else
                      TEST_RESULT_BOOT="fail"
                  fi
                  TEST_RESULTS=$(jq -n -c --arg url "${JOB_URL}" --arg result "${TEST_RESULT_BOOT}" '{boot: $ARGS.named}')
              else
                  # get suites and results
                  JOB_SUITES=$(lava_api "jobs/$JOB_ID/suites/")
                  TEST_RESULTS=$(for SUITE in $(echo "$JOB_SUITES" | jq -r -c ".results[]")
                  do
                      if [ "${JOB_STATE}" = "Finished" ]; then
                          SUITE_NAME=$(echo "$SUITE" | jq -r ".name")
                          SUITE_ID=$(echo "$SUITE" | jq -r ".id")
                          SUITE_TESTS=$(lava_api "jobs/$JOB_ID/suites/$SUITE_ID/tests/")
                          if [ "$SUITE_NAME" != "lava" ]; then
                              # resource_uri points to the REST API, link to the test case page instead
                              echo "$SUITE_TESTS" | jq --arg base "${INPUTS_LAVA_BASE_URL}" '.results[] | {(.name): {result: .result, url: "\($base)/results/testcase/\(.id)"}} | to_entries | .[]'
                          fi
                      fi
                  done | jq -s -c --sort-keys 'from_entries')
              fi
              echo "{\"key\": \"$JOB_DEVICE_TYPE\", \"value\": $TEST_RESULTS}" | jq
          # combine entries from boot jobs and pre-merge jobs
          done | jq -s -c 'reduce .[] as $i ({}; .[$i.key] = ((.[$i.key] // {}) + $i.value))')
          echo "$INPUT"

          # Load the list of known failures. An entry is either a bare test
          # name or a mapping with a "test", an optional "comment" holding the
          # issue it is tracked in, and an optional "kernels" list restricting
          # it to some kernel flavours. Both forms are normalised to
          # {device: {test name: comment}}.
          KNOWN_FAILURES="{}"
          if [ -n "${INPUTS_KNOWN_FAILURES_FILE}" ]; then
              if [ -f "${GITHUB_WORKSPACE}/${INPUTS_KNOWN_FAILURES_FILE}" ]; then
                  KNOWN_FAILURES_RAW=$(yq -o=json -I=0 "${GITHUB_WORKSPACE}/${INPUTS_KNOWN_FAILURES_FILE}" | jq -c '. // {}')
                  KNOWN_FAILURES=$(echo "${KNOWN_FAILURES_RAW}" | jq -c --arg kernel "${INPUTS_KERNEL}" '
                    with_entries(.value |= ((. // []) | map(
                      if type == "string" then {key: ., value: ""}
                      elif type == "object" and (.test | type) == "string" then
                        # an entry without a kernels filter applies everywhere
                        if (.kernels | type) == "array" and ((.kernels | index($kernel)) | not) then empty
                        else {key: .test, value: (.comment // "" | tostring)}
                        end
                      else empty
                      end) | from_entries))')
                  # entries filtered out by kernel, and entries matching neither
                  # form, are dropped by the mapping above
                  RAW_COUNT=$(echo "${KNOWN_FAILURES_RAW}" | jq --arg kernel "${INPUTS_KERNEL}" '[.[] | (. // []) | map(select((type != "object") or ((.kernels | type) != "array") or ((.kernels | index($kernel)) != null))) | length] | add // 0')
                  KNOWN_COUNT=$(echo "${KNOWN_FAILURES}" | jq '[.[] | length] | add // 0')
                  if [ "${RAW_COUNT}" != "${KNOWN_COUNT}" ]; then
                      echo "::warning::${INPUTS_KNOWN_FAILURES_FILE}: ignored $((RAW_COUNT - KNOWN_COUNT)) malformed entry/entries"
                  fi
              else
                  echo "::warning::known failures file ${INPUTS_KNOWN_FAILURES_FILE} not found"
              fi
          fi
          echo "${KNOWN_FAILURES}"

          # Turn the LAVA result of every test into the status that is
          # reported. A failure that is on the list is reported as a known
          # failure and counted as a pass. A test that passes while it is on
          # the list is reported as an unexpected pass and counted as a
          # failure, so that stale entries get noticed and removed. The comment
          # of the entry is carried over so it can be reported too.
          INPUT=$(echo "$INPUT" | jq -c --argjson known "${KNOWN_FAILURES}" '
            with_entries(
              # a device specific entry overrides the one listed for all devices
              (($known["*"] // {}) + ($known[.key] // {})) as $known_tests
              | .value |= with_entries(
                  .key as $test
                  | ($known_tests | has($test)) as $is_known
                  | .value.status = (
                      if .value.result == "fail" and $is_known then "known failure"
                      elif .value.result == "pass" and $is_known then "unexpected pass"
                      else .value.result
                      end)
                  | if $is_known then .value.comment = $known_tests[$test] else . end)
            )')
          echo "$INPUT"

          DEVICES=$(echo "$INPUT" | jq -r 'keys[]' | sort)

          RESULTS=$(echo "$INPUT" | jq -r '.[] | keys[]?' | sort -u)

          # Print collapsible box
          echo "<details>" >> "${INPUTS_SUMMARY_FILE_NAME}"
          # Print section summary
          TOTAL_PASS=$(echo "${INPUT}" | jq '[.. | objects | select(.status? == "pass")] | length')
          TOTAL_KNOWN_FAIL=$(echo "${INPUT}" | jq '[.. | objects | select(.status? == "known failure")] | length')
          # an unexpected pass counts as a failure: the known failures list is
          # out of date and has to be updated
          TOTAL_FAIL=$(echo "${INPUT}" | jq '[.. | objects | select(.status? == "fail" or .status? == "unexpected pass")] | length')
          TOTAL=$(echo "${INPUT}" | jq '[.. | objects | select(.result)] | length')
          SUMMARY_TITLE=""
          if [ "${INPUTS_SUMMARY_TITLE}" != "" ]; then
            SUMMARY_TITLE="${INPUTS_SUMMARY_TITLE}<br/>"
          fi
          KNOWN_SUMMARY=""
          if [ "${TOTAL_KNOWN_FAIL}" -gt 0 ]; then
            KNOWN_SUMMARY="Known failures: $TOTAL_KNOWN_FAIL | "
          fi
          echo "<summary>${SUMMARY_TITLE}Pass: $TOTAL_PASS | ${KNOWN_SUMMARY}Fail: $TOTAL_FAIL | Total: $TOTAL </summary>" >> "${INPUTS_SUMMARY_FILE_NAME}"
          echo "" >> "${INPUTS_SUMMARY_FILE_NAME}"
          echo "" >> "${INPUTS_SUMMARY_FILE_NAME}"

          # Print header row
          printf "| %s |" "Test"
          printf "| %s |" "Test" >> "${INPUTS_SUMMARY_FILE_NAME}"
          for D in $DEVICES; do
            printf " %s |" "$D"
            printf " %s |" "$D" >> "${INPUTS_SUMMARY_FILE_NAME}"
          done
          echo
          echo "" >> "${INPUTS_SUMMARY_FILE_NAME}"

          ## Print separator
          printf "| ---- |"
          printf "| ---- |" >> "${INPUTS_SUMMARY_FILE_NAME}"
          for _ in $DEVICES; do
            printf " ---- |"
            printf " ---- |" >> "${INPUTS_SUMMARY_FILE_NAME}"
          done
          echo
          echo "" >> "${INPUTS_SUMMARY_FILE_NAME}"

          for R in $RESULTS; do
            printf "| %s |" "$R"
            printf "| %s |" "$R" >> "${INPUTS_SUMMARY_FILE_NAME}"

            for D in $DEVICES; do
              VALUE=$(echo "$INPUT" | jq -r --arg d "$D" --arg r "$R" '.[$d][$r].status // ""')
              URL=$(echo "$INPUT" | jq -r --arg d "$D" --arg r "$R" '.[$d][$r].url // ""')
              CHECKMARK=":white_check_mark:"
              if [ "${VALUE}" = "fail" ]; then CHECKMARK=":x:"; fi
              if [ "${VALUE}" = "unexpected pass" ]; then CHECKMARK=":x:"; fi
              if [ "${VALUE}" = "known failure" ]; then CHECKMARK=":ballot_box_with_check:"; fi
              if [ "${VALUE}" = "skip" ]; then CHECKMARK=":warning:"; fi
              if [ -z "${VALUE}" ]; then CHECKMARK=":no_entry_sign:"; fi
              printf " %s [%s](%s) |" "$CHECKMARK" "$VALUE" "$URL"
              printf " %s [%s](%s) |" "$CHECKMARK" "$VALUE" "$URL" >> "${INPUTS_SUMMARY_FILE_NAME}"
            done
            echo "" >> "${INPUTS_SUMMARY_FILE_NAME}"
          done
          echo "" >> "${INPUTS_SUMMARY_FILE_NAME}"
          echo "</details>" >> "${INPUTS_SUMMARY_FILE_NAME}"
          # Print the entries of the known failures list that were applied,
          # together with the issue each one is annotated with
          KNOWN_ROWS=$(echo "$INPUT" | jq -r '
            to_entries[] | .key as $device | .value | to_entries[]
            | select(.value.status == "known failure" or .value.status == "unexpected pass")
            | "| \($device) | \(.key) | \(.value.status) | \(.value.comment // "") |"' | sort)
          if [ -n "${KNOWN_ROWS}" ]; then
            echo "<details>" >> "${INPUTS_SUMMARY_FILE_NAME}"
            echo "<summary>Known failures ($(echo "${KNOWN_ROWS}" | wc -l))</summary>" >> "${INPUTS_SUMMARY_FILE_NAME}"
            echo "" >> "${INPUTS_SUMMARY_FILE_NAME}"
            echo "| Device | Test | Status | Comment |" >> "${INPUTS_SUMMARY_FILE_NAME}"
            echo "| ---- | ---- | ---- | ---- |" >> "${INPUTS_SUMMARY_FILE_NAME}"
            echo "${KNOWN_ROWS}" >> "${INPUTS_SUMMARY_FILE_NAME}"
            echo "" >> "${INPUTS_SUMMARY_FILE_NAME}"
            echo "</details>" >> "${INPUTS_SUMMARY_FILE_NAME}"
          fi

          echo "<details>" >> "${INPUTS_SUMMARY_FILE_NAME}"
          echo "<summary>All jobs summary</summary>" >> "${INPUTS_SUMMARY_FILE_NAME}"
          echo "" >> "${INPUTS_SUMMARY_FILE_NAME}"
          echo "| Job ID | Device | State | Health |" >> "${INPUTS_SUMMARY_FILE_NAME}"
          echo "| ---- | ---- | ---- | ---- |" >> "${INPUTS_SUMMARY_FILE_NAME}"
          for TESTJOB in ${TESTJOBS}
          do
              JOB_ID=$(cat "${TESTJOB}" | jq ".id")
              JOB_URL="${INPUTS_LAVA_BASE_URL}/results/$JOB_ID"
              JOB_DETAILS=$(lava_api "jobs/$JOB_ID/")
              JOB_HEALTH=$(echo "$JOB_DETAILS" | jq -r ".health")
              JOB_STATE=$(echo "$JOB_DETAILS" | jq -r ".state")
              JOB_DEVICE_TYPE=$(echo "$JOB_DETAILS" | jq -r ".requested_device_type")
              echo "| [$JOB_ID]($JOB_URL) | $JOB_DEVICE_TYPE | $JOB_STATE | $JOB_HEALTH |" >> "${INPUTS_SUMMARY_FILE_NAME}"
          done
          echo "</details>" >> "${INPUTS_SUMMARY_FILE_NAME}"
      - name: Upload summary
        id: upload-summary
        uses: actions/upload-artifact@v6
        with:
          path: "${{ inputs.summary_file_name }}"
          name: "${{ inputs.summary_file_name }}"

